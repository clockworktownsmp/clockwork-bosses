plugins {
    // Loom supplies the exact configured Minecraft/Fabric classes and development launchers.
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

// Never infer a deployment host from a prerelease suffix. Missing/invalid build
// input fails packaging; the released 0.2.0 jar remains a separate stable artifact.
if (!(project.workshop_build_channel in ['stable', 'beta', 'development'])) {
    throw new GradleException('workshop_build_channel must be stable, beta, or development')
}

base {
    archivesName = project.archives_base_name
}

loom {
    // Client-only rendering/audio classes stay out of dedicated-server class loading.
    splitEnvironmentSourceSets()

    runs {
        client {
            runDir("run/client")
        }
    }

    mods {
        "clockwork_bosses" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    // Pin the user's 26.3 environment; do not rely on older mapped method names.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Replaceable pure-Java decoder for bounded workshop upload validation.
    // It stays inside the distributable jar; no companion/library install is needed.
    include implementation('org.jcraft:jorbis:0.0.17')
}

// Public pinned artifact for isolated compatibility checks. Never bundle this
// third-party mod or turn it into a required runtime dependency.
repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeModule('maven.modrinth', 'better-combat') }
    }
}

// Capture version properties during configuration, not inside a running task.
def modResourceProperties = [version: project.version.toString(),
        workshop_build_channel: project.workshop_build_channel.toString(),
        minecraft_version: project.minecraft_version.toString(),
        loader_version: project.loader_version.toString(),
        fabric_api_version: project.fabric_api_version.toString()]
processResources {
    inputs.properties(modResourceProperties)
    filteringCharset = "UTF-8"
    filesMatching("fabric.mod.json") { expand(modResourceProperties) }
}

def targetJavaVersion = 25
// 26.3 runs on Java 25; both source sets and bundled mixins use the same target.
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(targetJavaVersion)
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

// Build the offline workshop fallback from the same core setting definitions.
// Live servers additionally export their installed addon registry. Raw default
// resources suffice here; depending on processed resources would form a cycle.
def generatedWorkshopSchema = layout.buildDirectory.dir('generated/workshop-schema')
tasks.register('generateWorkshopSchema', JavaExec) {
    dependsOn compileJava
    classpath = sourceSets.main.output.classesDirs + sourceSets.main.compileClasspath + files('src/main/resources')
    mainClass = 'clockwork.bosses.ClockworkBossTemplateSchema'
    args generatedWorkshopSchema.get().file('template-schema.json').asFile.absolutePath
    inputs.files(sourceSets.main.output.classesDirs, file('src/main/resources/default-clockwork-boss.json'))
    outputs.file(generatedWorkshopSchema.map { it.file('template-schema.json') })
}
sourceSets.main.resources.srcDir(generatedWorkshopSchema)
processResources.dependsOn generateWorkshopSchema
tasks.named('sourcesJar') { dependsOn generateWorkshopSchema }

// Native combat regressions are a separate development-only mod and disposable
// GameTest world. Neither these classes nor their entrypoint enter the release jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    clientcheck {
        compileClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.client.output + sourceSets.client.runtimeClasspath
    }
    bettercombatcheck {
        compileClasspath += sourceSets.gametest.output + sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.gametest.output + sourceSets.gametest.runtimeClasspath
    }
}
dependencies {
    compileOnly('maven.modrinth:better-combat:8Vyq1h9a') { transitive = false }
    bettercombatcheckCompileOnly('maven.modrinth:better-combat:8Vyq1h9a') { transitive = false }
}
loom {
    mods {
        "clockwork_bosses_regression" { sourceSet sourceSets.gametest }
        "clockwork_bosses_clientcheck" { sourceSet sourceSets.clientcheck }
        "clockwork_bosses_bettercombat_checks" { sourceSet sourceSets.bettercombatcheck }
    }
    runs {
        bettercombatcheck {
            server()
            source sourceSets.bettercombatcheck
            name "Clockwork Boss Better Combat compatibility checks"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/compat-bettercombat/gametest.xml"
            runDir "build/compat-bettercombat"
            ideConfigGenerated false
        }
        gametest {
            server()
            source sourceSets.gametest
            name "Clockwork Boss combat regressions"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-file=${project.layout.buildDirectory.get().asFile}/combat-gametest.xml"
            runDir "build/combat-gametest"
            ideConfigGenerated false
        }
        clientcheck {
            client()
            source sourceSets.clientcheck
            name "Clockwork Boss client keyframe checks"
            runDir "build/client-check"
            ideConfigGenerated false
        }
        clientlootcheck {
            client()
            source sourceSets.clientcheck
            name "Clockwork Boss loot GUI checks"
            runDir "build/loot-client-check"
            vmArg "-Dfabric.client.gametest"
            ideConfigGenerated false
        }
    }
}

def licenseArchiveName = "LICENSE_${project.archives_base_name}"
jar {
    from("LICENSE") { rename { licenseArchiveName } }
    from('THIRD_PARTY.md')
}

// Regression checks exercise production config/media helpers without launching Minecraft.
// They use only existing runtime dependencies, so no testing framework is downloaded.
tasks.register('auditChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'clockwork.bosses.ClockworkBossAuditChecks'
}
check.dependsOn auditChecks
tasks.register('templateTaskChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'clockwork.bosses.ClockworkBossTemplateTaskChecks'
}
check.dependsOn templateTaskChecks
tasks.register('encounterApiChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'clockwork.bosses.ClockworkBossApiChecks'
}
check.dependsOn encounterApiChecks

// The workshop is a server module in this mod. Its file/API suites use only
// disposable fixtures; no real server mount, hosted website or player data.
['workshopApiChecks':'ApiChecks', 'workshopSkinChecks':'SkinChecks',
 'workshopTighteningChecks':'TighteningChecks', 'workshopAudioChecks':'AudioChecks',
 'workshopRelayChecks':'RelayChecks', 'workshopConfigReloadChecks':'ConfigReloadChecks',
 'workshopPresetChecks':'PresetChecks', 'workshopDraftMediaChecks':'DraftMediaChecks',
 'workshopItemCatalogChecks':'ItemCatalogChecks', 'workshopSoundUploadChecks':'SoundUploadChecks',
 'workshopMergeChecks':'WorkshopMergeChecks', 'workshopAdapterChecks':'WorkshopAdapterChecks',
 'workshopCoreSchemaChecks':'WorkshopCoreSchemaChecks', 'workshopChannelChecks':'ChannelChecks'].each { taskName, checkClass ->
    tasks.register(taskName, JavaExec) {
        dependsOn testClasses
        classpath = sourceSets.test.runtimeClasspath
        mainClass = "clockwork.web.${checkClass}"
    }
    check.dependsOn taskName
}
tasks.register('exportRelayTestClasspath') {
    dependsOn testClasses
    doLast { layout.buildDirectory.file('relay-test-classpath.txt').get().asFile.text = sourceSets.test.runtimeClasspath.asPath }
}

// Export the shared editor/API definitions as plain JSON for offline/browser
// tooling. This starts a short Java process, never Minecraft or a server.
tasks.register('exportTemplateSchema', JavaExec) {
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'clockwork.bosses.ClockworkBossTemplateSchema'
    args layout.buildDirectory.file('template-schema.json').get().asFile.absolutePath
}

// Optional independent JSON Schema validator input. The fixture addon and JSON
// outputs live under build/ and never enter the main/client release jar.
tasks.register('exportSchemaFixtures', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'clockwork.bosses.ClockworkBossTemplateSchemaChecks'
    args layout.buildDirectory.dir('template-schema-fixtures').get().asFile.absolutePath
}

// These regression checks use a standalone main, not a JUnit/TestNG engine.
// Gradle 9 otherwise treats that intentional lack of framework tests as a failure.
// auditChecks remains mandatory for check/build and fails on any assertion error.
tasks.named('test') {
    failOnNoDiscoveredTests = false
}

// A normally closed Minecraft process has exit code zero even if a client
// assertion failed; require the explicit fixture result instead of masking it.
tasks.named('runClientcheck') {
    doFirst { java.nio.file.Files.deleteIfExists(layout.buildDirectory.file('client-check/client-check-result.txt').get().asFile.toPath()) }
    doLast {
        def result = layout.buildDirectory.file('client-check/client-check-result.txt').get().asFile
        if (!result.isFile() || !result.text.startsWith('PASS:')) throw new GradleException('Native client keyframe checks did not pass')
    }
}

// Fabric closes the temporary world/client; require explicit successful assertions as well as exit status.
tasks.named('runClientlootcheck') {
    doFirst { java.nio.file.Files.deleteIfExists(layout.buildDirectory.file('loot-client-check/loot-gui-check-result.txt').get().asFile.toPath()) }
    doLast {
        def result = layout.buildDirectory.file('loot-client-check/loot-gui-check-result.txt').get().asFile
        if (!result.isFile() || !result.text.startsWith('PASS:')) throw new GradleException('Native loot GUI checks did not pass')
    }
}

