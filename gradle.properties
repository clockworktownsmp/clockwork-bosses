org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=26.3
loader_version=0.19.5
fabric_api_version=0.161.0+26.3

# SemVer: numeric major.minor.patch, followed by -beta.N or -rc.N for prereleases.
# Fabric metadata and jar filenames both use this value through build.gradle.
mod_version=0.3.0-rc.3
# Workshop routing is deliberately independent of mod_version and branch names.
# This isolated release candidate uses beta explicitly; its version never selects a host.
workshop_build_channel=beta
maven_group=clockwork
archives_base_name=clockwork_bosses
loom_version=1.18.2
